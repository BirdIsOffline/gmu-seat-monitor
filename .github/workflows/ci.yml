name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (Python 3.12, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q monitor.py setup_bark.py health_runner.py seat_history.py demo_history.py cloud_history.py history_outbox.py history_capture.py history_submit.py demo_live_history.py tests cloudflare/test/parity.py cloudflare/test/outbox_roundtrip.py cloudflare/test/live_roundtrip.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run safe demo (no GMU or Bark calls)
        run: python monitor.py --demo
      - name: Run synthetic SQLite demo (temporary database, no network)
        run: python demo_history.py
      - name: Run synthetic structured handoff demo (no external requests)
        run: python demo_live_history.py
      - name: Set up Node for local Worker tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install local Worker development dependencies
        run: npm ci --prefix cloudflare
      - name: Run offline Worker and Python-to-D1 parity tests
        run: npm test --prefix cloudflare
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/src/worker.js && node --check cloudflare/test/worker.test.js && node --check cloudflare/demo_timeline.js
      - name: Run synthetic direct D1 ingestion demo
        run: npm run demo --prefix cloudflare
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
