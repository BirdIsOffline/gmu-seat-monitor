name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q monitor.py setup_bark.py health_runner.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run safe demo (no GMU or Bark calls)
        run: python monitor.py --demo
