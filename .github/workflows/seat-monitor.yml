name: GMU seat monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test Bark only, or run one GMU check (if authorized)"
        required: true
        default: test
        type: choice
        options:
          - test
          - check

permissions:
  contents: read

concurrency:
  group: gmu-seat-monitor
  cancel-in-progress: false

jobs:
  test-bark:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Send Bark test (NO GMU requests)
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: python monitor.py --test-notification

  check-seats:
    # No unattended GMU requests until explicit authorization is recorded.
    if: vars.GMU_POLLING_APPROVED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore recent public seat status
        uses: actions/cache/restore@v4
        with:
          path: seat_state.json
          key: gmu-seat-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gmu-seat-state-
      - name: Check both courses once and send any Bark alerts
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          # Local structured capture only; no ingestion secret in monitoring.
          GMU_HISTORY_CAPTURE_ENABLED: ${{ vars.GMU_HISTORY_CAPTURE_ENABLED }}
          GMU_HISTORY_CAPTURE_DIR: ${{ runner.temp }}/gmu-history-${{ github.run_id }}-${{ github.run_attempt }}
        run: python health_runner.py
      - name: Validate public seat state even after a failed check
        if: always()
        id: seat-state
        run: |
          python - <<'PYTHON'
          import os
          from health_runner import state_is_valid
          valid = state_is_valid("seat_state.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"valid={str(valid).lower()}\n")
          if not valid:
              print("No valid public seat state available to cache.")
          PYTHON
      - name: Save public seat status for next scheduled check
        if: always() && steps.seat-state.outputs.valid == 'true'
        uses: actions/cache/save@v4
        with:
          path: seat_state.json
          key: gmu-seat-state-${{ github.run_id }}-${{ github.run_attempt }}
      # State persistence finishes first. Failure/cancellation of history must
      # never suppress the monitor's health outcome or its existing cache save.
      - name: Submit original historical observations (explicit opt-in only)
        if: ${{ !cancelled() && vars.GMU_HISTORY_CAPTURE_ENABLED == 'true' && vars.GMU_HISTORY_ENABLED == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GMU_HISTORY_ENABLED: ${{ vars.GMU_HISTORY_ENABLED }}
          # Dedicated production target: never fall back to synthetic staging.
          GMU_HISTORY_PRODUCTION_ENDPOINT: ${{ vars.GMU_HISTORY_PRODUCTION_ENDPOINT }}
          GMU_HISTORY_PRODUCTION_TOKEN: ${{ secrets.GMU_HISTORY_PRODUCTION_TOKEN }}
        run: >-
          python history_submit.py
          "${{ runner.temp }}/gmu-history-${{ github.run_id }}-${{ github.run_attempt }}"
          --deadline-seconds 20
          --report "${{ runner.temp }}/gmu-history-report.json"
